<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBPage</title>
    <link rel="icon" type="image/png" href="/static/database.png">
    <link rel="stylesheet" href="/static/css/style.css?v=16">
</head>

<body>
    <header>
        <div class="header-left">
            <div class="brand" role="button" tabindex="0">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3" />
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                        <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
                    </svg>
                </span>
                <span class="brand-name">DBPage</span>
            </div>

            <!-- 顶栏三页一体化导航 (P1 / P2 / P3) -->
            <span id="header-nav-sep" class="header-nav-sep hidden" aria-hidden="true"></span>
            <nav id="top-nav" class="top-nav hidden" aria-label="页面导航">
                <button type="button" id="nav-connections" class="top-nav-item" data-view="connections">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                    <span>连接列表</span>
                </button>
                <button type="button" id="nav-data" class="top-nav-item" data-view="data">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
                    <span>数据浏览</span>
                </button>
                <button type="button" id="nav-sql" class="top-nav-item" data-view="sql">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                    <span id="nav-sql-label">查询</span>
                </button>
            </nav>

            <!-- 顶栏蓝框位：当前已连接胶囊 + 备注提示 -->
            <span id="header-conn-sep" class="header-nav-sep hidden" aria-hidden="true"></span>
            <div id="active-conn-bar" class="active-conn-bar hidden">
                <div id="active-conn-switcher" class="custom-select conn-pill-switcher">
                    <button type="button" id="active-conn-trigger" class="conn-pill-btn">
                        <span class="conn-live-dot" aria-hidden="true"></span>
                        <span class="conn-pill-status">已连接</span>
                        <span class="conn-pill-sep">·</span>
                        <span id="active-conn-name" class="conn-pill-name">Local</span>
                        <span id="active-conn-type" class="conn-pill-type">PG</span>
                        <svg class="conn-pill-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="custom-select-menu conn-pill-menu">
                        <div id="active-conn-list" class="custom-select-options"></div>
                    </div>
                </div>
                <div id="active-conn-remark" class="conn-remark-chip hidden"></div>
            </div>
        </div>
    </header>

    <main>
        <!-- P1: 连接卡片页面 -->
        <div id="connections-view">
            <div class="view-header">
                <div class="conn-header-left">
                    <h2>数据库连接</h2>
                    <div id="conn-filter-tabs" class="conn-filter-tabs">
                        <button type="button" class="conn-tab active" data-type="all">全部</button>
                        <button type="button" class="conn-tab" data-type="postgresql">PostgreSQL</button>
                        <button type="button" class="conn-tab" data-type="mysql">MySQL</button>
                        <button type="button" class="conn-tab" data-type="redis">Redis</button>
                    </div>
                </div>
                <button id="btn-add-conn" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span>新建连接</span>
                </button>
            </div>
            <div id="conn-cards" class="cards-grid"></div>
        </div>

        <!-- P2: 数据浏览页面 -->
        <div id="data-view" class="hidden">
            <div class="data-toolbar-row">
                <div class="toolbar-inline">
                    <!-- 分组 1：数据源定位 -->
                    <select id="db-select">
                        <option value="">选择数据库</option>
                    </select>
                    <select id="table-select">
                        <option value="">选择表</option>
                    </select>
                    <button type="button" id="btn-refresh-data" class="btn-secondary hidden" title="刷新当前数据">
                        <svg id="icon-refresh" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                        <span>刷新</span>
                    </button>

                    <span id="toolbar-div-1" class="toolbar-divider hidden" aria-hidden="true"></span>

                    <!-- 分组 2：视图与筛选控制 -->
                    <div id="col-picker" class="custom-select col-picker hidden">
                        <button type="button" id="col-picker-trigger" class="custom-select-trigger">
                            <span class="custom-select-value-wrap">
                                <span class="custom-select-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
                                </span>
                                <span id="col-picker-label" class="custom-select-label">显示字段</span>
                            </span>
                            <span class="custom-select-chevron">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                            </span>
                        </button>
                        <div class="custom-select-menu col-picker-menu">
                            <div class="custom-select-search-wrap">
                                <span class="custom-select-search-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                </span>
                                <input type="text" id="col-picker-search" class="custom-select-search" placeholder="搜索字段">
                            </div>
                            <div class="col-picker-actions">
                                <button type="button" id="col-picker-all" class="col-picker-link">全选</button>
                                <button type="button" id="col-picker-invert" class="col-picker-link">反选</button>
                            </div>
                            <div id="col-picker-list" class="custom-select-options"></div>
                        </div>
                    </div>
                    <button type="button" id="btn-equal-width" class="btn-secondary hidden" title="按当前显示字段数量平分表格宽度">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 4v16"/></svg>
                        <span>平分宽度</span>
                    </button>
                    <button type="button" id="btn-toggle-filter" class="btn-secondary hidden">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                        <span>筛选</span>
                        <span id="filter-badge" class="filter-badge hidden"></span>
                    </button>
                    <!-- 视图显示设置下拉 -->
                    <div id="view-opts-picker" class="custom-select view-opts-picker hidden">
                        <button type="button" id="view-opts-trigger" class="btn-secondary" title="表格显示设置">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
                            <span>视图</span>
                        </button>
                        <div class="custom-select-menu view-opts-menu">
                            <div class="view-opts-list">
                                <label class="view-opt-item">
                                    <span>表头字段类型</span>
                                    <input type="checkbox" id="opt-show-col-types" class="toggle-input">
                                    <span class="toggle-track"></span>
                                </label>
                                <label class="view-opt-item">
                                    <span>显示左侧行号 #</span>
                                    <input type="checkbox" id="opt-show-row-index" class="toggle-input">
                                    <span class="toggle-track"></span>
                                </label>
                            </div>
                            <div class="view-opt-footer">
                                单击复制 · 双击编辑 · 悬停右侧展开详情
                            </div>
                        </div>
                    </div>

                    <span id="toolbar-div-2" class="toolbar-divider hidden" aria-hidden="true"></span>

                    <!-- 分组 3：数据操作与导出 -->
                    <button type="button" id="btn-add-row" class="btn-primary hidden">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                        <span id="label-add-row">新增记录</span>
                    </button>
                    <div id="export-picker" class="custom-select export-picker hidden">
                        <button type="button" id="export-picker-trigger" class="btn-secondary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            <span>导出</span>
                        </button>
                        <div class="custom-select-menu export-picker-menu">
                            <div class="custom-select-options">
                                <div class="custom-select-option" data-format="csv"><span class="custom-select-option-text">导出当前页 CSV</span></div>
                                <div class="custom-select-option" data-format="json"><span class="custom-select-option-text">导出当前页 JSON</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 按字段条件筛选栏 -->
            <div id="filter-bar" class="filter-bar hidden">
                <span class="filter-bar-label">筛选条件</span>
                <select id="filter-col-select">
                    <option value="">选择字段</option>
                </select>
                <select id="filter-op-select">
                    <option value="contains">包含</option>
                    <option value="eq">等于 (=)</option>
                    <option value="neq">不等于 (!=)</option>
                    <option value="gt">大于 (&gt;)</option>
                    <option value="lt">小于 (&lt;)</option>
                    <option value="isnull">为空 (IS NULL)</option>
                    <option value="notnull">不为空 (IS NOT NULL)</option>
                </select>
                <input type="text" id="filter-val-input" class="filter-val-input" placeholder="输入筛选值，回车查询">
                <button type="button" id="btn-apply-filter" class="btn-primary">查询</button>
                <button type="button" id="btn-clear-filter" class="btn-secondary">重置</button>
            </div>

            <div id="data-table-stage" class="table-stage">
                <div id="table-wrap" class="table-wrap">
                    <table id="data-table">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button type="button" id="floating-row-del" class="floating-row-del hidden" title="删除此行" aria-label="删除此行">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                </button>
            </div>

            <div class="pagination hidden" id="pagination">
                <div class="page-info">
                    第 <span id="page-num">1</span> / <span id="page-total">1</span> 页
                    <span class="page-info-sep">·</span>
                    共 <span id="row-total">0</span> 条
                </div>
                <div class="page-pills" id="page-pills">
                    <button type="button" id="btn-first" aria-label="首页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m11 17-5-5 5-5" />
                            <path d="m18 17-5-5 5-5" />
                        </svg>
                    </button>
                    <button type="button" id="btn-prev" aria-label="上一页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                    </button>
                    <div class="page-numbers" id="page-numbers"></div>
                    <button type="button" id="btn-next" aria-label="下一页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m9 18 6-6-6-6" />
                        </svg>
                    </button>
                    <button type="button" id="btn-last" aria-label="尾页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m13 17 5-5-5-5" />
                            <path d="m6 17 5-5-5-5" />
                        </svg>
                    </button>
                </div>
                <div class="page-size">
                    <label>每页</label>
                    <select id="page-size">
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                    </select>
                    <label>条</label>
                </div>
            </div>
        </div>

        <!-- P3: SQL / 命令查询页面 -->
        <div id="sql-view" class="hidden">
            <div class="sql-panel">
                <div class="sql-toolbar">
                    <div class="sql-toolbar-left">
                        <label id="sql-editor-label" for="sql-input">SQL 编辑器</label>
                        <select id="sql-db-select">
                            <option value="">选择数据库</option>
                        </select>
                        <span class="kbd-hint">⌘/Ctrl + Enter 运行</span>
                    </div>
                    <div class="sql-toolbar-right">
                        <div id="history-picker" class="custom-select history-picker">
                            <button type="button" id="history-picker-trigger" class="btn-secondary btn-sm">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                                <span>历史记录</span>
                            </button>
                            <div class="custom-select-menu history-picker-menu">
                                <div id="history-list" class="custom-select-options"></div>
                            </div>
                        </div>
                        <button type="button" id="btn-export-sql-csv" class="btn-secondary btn-sm hidden">导出 CSV</button>
                        <button type="button" id="btn-export-sql-json" class="btn-secondary btn-sm hidden">导出 JSON</button>
                        <button id="btn-run-sql" class="btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                            <span>执行</span>
                        </button>
                    </div>
                </div>
                <textarea id="sql-input" placeholder="SELECT * FROM table_name LIMIT 10" spellcheck="false"></textarea>
                <div id="sql-error" class="sql-error hidden"></div>
            </div>
            <div id="sql-table-wrap" class="table-wrap">
                <table id="sql-result-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- 单元格详情 / 多行 JSON 编辑弹窗 -->
        <div id="cell-modal" class="modal hidden">
            <div class="modal-content modal-content-lg">
                <div class="modal-header-row">
                    <div>
                        <h3 id="cell-modal-title">编辑字段</h3>
                        <p id="cell-modal-meta" class="modal-submeta"></p>
                    </div>
                    <div class="modal-header-tools">
                        <button type="button" id="btn-cell-format-json" class="btn-secondary btn-sm">格式化 JSON</button>
                        <button type="button" id="btn-cell-copy" class="btn-secondary btn-sm">复制内容</button>
                    </div>
                </div>
                <textarea id="cell-modal-textarea" class="cell-modal-textarea" spellcheck="false"></textarea>
                <div class="modal-actions modal-actions-split">
                    <button type="button" id="btn-cell-set-null" class="btn-secondary">设为 NULL</button>
                    <div class="modal-actions-right">
                        <button type="button" id="btn-cell-cancel" class="btn-secondary">取消</button>
                        <button type="button" id="btn-cell-save" class="btn-primary">保存修改</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新增记录 / 新增 Key 弹窗 -->
        <div id="row-modal" class="modal hidden">
            <div class="modal-content modal-content-lg">
                <h3 id="row-modal-title">新增记录</h3>
                <div id="row-modal-fields" class="row-modal-fields"></div>
                <div class="modal-actions">
                    <button type="button" id="btn-save-row" class="btn-primary">保存</button>
                    <button type="button" id="btn-cancel-row" class="btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 自定义提示框 -->
        <div id="custom-confirm" class="modal hidden">
            <div class="modal-content modal-content-sm">
                <h3 id="confirm-title">提示</h3>
                <p id="confirm-message" class="confirm-message"></p>
                <div class="modal-actions">
                    <button id="btn-confirm-yes" class="btn-primary">确定</button>
                    <button id="btn-confirm-no" class="btn-secondary">取消</button>
                    <button id="btn-confirm-ok" class="btn-primary hidden">确定</button>
                </div>
            </div>
        </div>

        <!-- 连接编辑弹窗 -->
        <div id="conn-modal" class="modal hidden">
            <div class="modal-content">
                <h3 id="modal-title">新建连接</h3>
                <input type="hidden" id="modal-conn-id">
                <div class="field">
                    <label for="modal-name">连接名称</label>
                    <input type="text" id="modal-name" placeholder="生产环境">
                </div>
                <div class="field">
                    <label for="modal-type">数据库类型</label>
                    <select id="modal-type">
                        <option value="postgresql">PostgreSQL</option>
                        <option value="mysql">MySQL</option>
                        <option value="redis">Redis</option>
                    </select>
                </div>
                <div class="field">
                    <label for="modal-host">主机</label>
                    <input type="text" id="modal-host" placeholder="localhost">
                </div>
                <div class="field">
                    <label for="modal-port">端口</label>
                    <input type="number" id="modal-port" placeholder="5432">
                </div>
                <div class="field">
                    <label for="modal-user">用户名 <span id="modal-user-hint" class="field-hint hidden">(ACL 用户名，可留空)</span></label>
                    <input type="text" id="modal-user" placeholder="postgres">
                </div>
                <div class="field">
                    <label for="modal-password">密码 <span id="modal-pwd-hint" class="field-hint hidden">(无密码可留空)</span></label>
                    <input type="password" id="modal-password" placeholder="密码">
                </div>
                <div class="field">
                    <label for="modal-remark">备注 <span class="field-hint">(选填，进入连接后显眼提示)</span></label>
                    <input type="text" id="modal-remark" placeholder="例如：本地测试库，可随意删改">
                </div>
                <div id="modal-test-result" class="modal-test-result hidden"></div>
                <div class="modal-actions">
                    <button type="button" id="btn-test-conn" class="btn-secondary">测试连接</button>
                    <button type="button" id="btn-cancel-conn" class="btn-secondary">取消</button>
                    <button type="button" id="btn-save-conn" class="btn-primary">保存</button>
                </div>
            </div>
        </div>
    </main>
    <div id="toast" class="toast hidden">已复制</div>
    <script src="/static/js/app.js?v=25"></script>
</body>

</html>
